name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment and AWS stack stage
        required: true
        type: choice
        options: [dev, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      STAGE: ${{ inputs.environment == 'production' && 'prod' || 'dev' }}
      DATABASE_CLUSTER_ARN: ${{ vars.DATABASE_CLUSTER_ARN }}
      API_RESERVED_CONCURRENCY: ${{ vars.API_RESERVED_CONCURRENCY }}
      WORKER_MAX_CONCURRENCY: ${{ vars.WORKER_MAX_CONCURRENCY }}
      MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
      BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
      OPERATIONAL_ALERT_EMAIL: ${{ vars.OPERATIONAL_ALERT_EMAIL }}
      GOOGLE_MAPS_SECRET_ARN: ${{ vars.GOOGLE_MAPS_SECRET_ARN }}
      OPENAI_SECRET_ARN: ${{ vars.OPENAI_SECRET_ARN }}
      PASSWORD_RESET_FROM_EMAIL: ${{ vars.PASSWORD_RESET_FROM_EMAIL }}
      PASSWORD_RESET_LINK_BASE: ${{ vars.PASSWORD_RESET_LINK_BASE }}
      EMAIL_VERIFICATION_LINK_BASE: ${{ vars.EMAIL_VERIFICATION_LINK_BASE }}
      RESPONSE_EXPORT_LINK_BASE: ${{ vars.RESPONSE_EXPORT_LINK_BASE }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
      WAF_MODE: ${{ vars.WAF_MODE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-infra.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --requirement requirements-infra.lock
      - run: npm ci
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-${{ github.run_id }}
      - name: Test infrastructure
        run: python -m pytest infra/tests -q
      - name: Validate deployment configuration
        run: python scripts/run_cdk_ci.py validate
      - name: Synthesize and scan
        run: python scripts/run_cdk_ci.py synth --strict
      - name: Review CloudFormation change set
        run: python scripts/run_cdk_ci.py diff WmAlerting-${{ env.STAGE }} WmData-${{ env.STAGE }} WmGeneration-${{ env.STAGE }} WmExports-${{ env.STAGE }} WmApi-${{ env.STAGE }} WmOperations-${{ env.STAGE }}
      - name: Deploy approved stacks
        run: python scripts/run_cdk_ci.py deploy --require-approval never --outputs-file cdk-outputs.json WmAlerting-${{ env.STAGE }} WmData-${{ env.STAGE }} WmGeneration-${{ env.STAGE }} WmExports-${{ env.STAGE }} WmApi-${{ env.STAGE }} WmOperations-${{ env.STAGE }}
      - name: Resolve deployed API URL
        id: deployed_api
        shell: bash
        run: |
          api_url="$(python -c "import json; print(json.load(open('cdk-outputs.json', encoding='utf-8'))['WmApi-${STAGE}']['ApiBaseUrl'])")"
          if [[ -z "$api_url" ]]; then
            echo "WmApi-${STAGE} did not expose ApiBaseUrl" >&2
            exit 1
          fi
          echo "base_url=$api_url" >> "$GITHUB_OUTPUT"
      - name: Run post-deployment smoke tests
        run: python scripts/post_deployment_smoke.py
        env:
          SMOKE_BASE_URL: ${{ steps.deployed_api.outputs.base_url }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_TTS_VOICE: ${{ vars.SMOKE_TEST_TTS_VOICE }}

